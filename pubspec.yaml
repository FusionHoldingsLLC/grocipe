  socket_io_client: ^2.0.3+1
  any_link_preview: ^3.0.2

  shimmer: ^3.0.0
  shared_preferences: ^2.1.2
  collection: ^1.18.0
  meta: ^1.12.0
  bloc: ^8.1.4
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  carousel_slider: ^5.0.0
  file_picker:
  get_it: ^7.7.0
  flutter_native_splash: ^2.4.0
  firebase_core: ^3.3.0
  firebase_crashlytics: ^4.0.4
  firebase_analytics: ^11.2.1




dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^1.1.3 # flutter packages pub run build_runner build
  build_runner: ^2.1.11
  flutter_gen_runner:

  flutter_lints: ^2.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/global/
    - assets/images/icons/
    - assets/images/placeholders/
    - assets/svgs/
    - assets/svgs/nav_bar/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
